name = "mise"
version = "0.1.0"
defaultTargets = ["Mise", "MiseTest", "mise"]

[[lean_lib]]
name = "Mise"

[[lean_lib]]
name = "MiseTest"
srcDir = "test"

# The Lean sides of the fuzzers in fuzz/; fuzz/build.sh links them.
[[lean_lib]]
name = "MiseFuzz"
srcDir = "fuzz"
roots = ["MiseFuzz.Parser", "MiseFuzz.Build"]

[[lean_exe]]
name = "mise"
root = "Main"

[[lean_exe]]
name = "difftest"
srcDir = "test"
root = "MiseTest.DiffTest"

[[lean_exe]]
name = "fuzzgen"
srcDir = "test"
root = "MiseTest.Fuzz"

[[lean_exe]]
name = "tomljson"
srcDir = "test"
root = "MiseTest.TomlJson"
