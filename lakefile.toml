name = "mise"
version = "0.1.0"
defaultTargets = ["Mise", "MiseTest", "mise"]

[[lean_lib]]
name = "Mise"

[[lean_lib]]
name = "MiseTest"
srcDir = "test"

# The in-process build fuzzer's Lean side; fuzz/build/build.sh links it.
[[lean_lib]]
name = "MiseFuzz"
srcDir = "fuzz/build"

[[lean_exe]]
name = "mise"
root = "Main"

[[lean_exe]]
name = "difftest"
srcDir = "test"
root = "MiseTest.DiffTest"

[[lean_exe]]
name = "fuzzgen"
srcDir = "test"
root = "MiseTest.Fuzz"

[[lean_exe]]
name = "tomljson"
srcDir = "test"
root = "MiseTest.TomlJson"
