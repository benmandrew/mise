# Every C file here is compiled, and the objects are linked into
# build/hello. The glob finds the sources, so a new C file is compiled and
# linked by the next `mise build`. The link comes first in the file; mise
# orders the builds by what they read.

source-globs = ["*.c", "*.h"]
defaults = ["build/hello"]

[params]
cflags = "-O2 -Wall"

[[rule]]
name = "cc"
command = "cc $cflags -c $in -o $out"
description = "CC $out"

[[rule]]
name = "link"
command = "cc $in -o $out"
description = "LINK $out"

[[build]]
rule = "link"
outs = ["build/hello"]
ins = ["build/%.o"]

# One compile per C file. Each also reads greet.h.
[[build]]
rule = "cc"
foreach = "%.c"
outs = ["build/%.o"]
ins = ["%.c"]
implicit-ins = ["greet.h"]
params = ["cflags"]

# `mise build -- objs` compiles without linking.
[aliases]
objs = ["build/%.o"]
