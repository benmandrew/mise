# A header generated by a script, and C files whose includes are found by the
# compiler's depfile. The generated header is the only generated file a
# compile may read, so it is each compile's order-only input. The generator
# leaves the header untouched when its contents would not change, and its
# rule has `restat`.

sources = ["main.c", "util.c", "util.h", "extra.h", "gen-config.py", "config.in"]
defaults = ["build/app"]

[params]
cflags = "-O2 -Wall"

[[rule]]
name = "gen"
command = "python3 $in $out"
description = "GEN $out"
restat = true

[[rule]]
name = "cc"
command = "cc $cflags -MMD -MF $out.d -Ibuild -I. -c $in -o $out"
description = "CC $out"
depfile = true

[[rule]]
name = "link"
command = "cc $in -o $out"
description = "LINK $out"

[[build]]
rule = "gen"
outs = ["build/config.h"]
ins = ["gen-config.py", "config.in"]

[[build]]
rule = "cc"
outs = ["build/main.o"]
ins = ["main.c"]
order-only = ["build/config.h"]
params = ["cflags"]

[[build]]
rule = "cc"
outs = ["build/util.o"]
ins = ["util.c"]
order-only = ["build/config.h"]
params = ["cflags"]

[[build]]
rule = "link"
outs = ["build/app"]
ins = ["build/main.o", "build/util.o"]
