# The heavy harnesses, once a day and on demand. In a scheduled run each
# job runs only when a file it depends on changed since the last commit on
# which it succeeded; a run from workflow_dispatch runs the jobs its
# `jobs` input names, or every job when it is empty. See
# docs/testing.md for each harness and its arguments.
#
# Jobs run on ubuntu-latest, the main platform. macOS also runs the
# priority jobs (500 random graphs, and the matrix on the latest release),
# and alone runs the harnesses that need macOS: the sandbox (sandbox-exec),
# the depfile tracer (its Linux path is untested), determinism (it masks
# Mach-O fields) and the HFS+ mtime faults (hdiutil). Times in the comments
# are local, on an 8-core M1; the runners have 2 to 4 cores, so expect them
# to be 2 to 3 times longer there.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: Jobs to run, space-separated (empty runs every job)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Decide which jobs run: each runs only when a file it depends on changed
  # since the last commit on main on which it succeeded (`test/run
  # affected`; each job's harnesses and dependencies are in
  # test/harnesses.toml). A job with no earlier success runs, and a failed
  # job does not count, so the next night tries it again. A run started by
  # hand runs the jobs in its `jobs` input, or every job.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          JOBS: ${{ inputs.jobs }}
        run: |
          args=()
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$JOBS" ]; then args=(--only "$JOBS"); else args=(--all); fi
          fi
          python3 test/run affected "${args[@]}" nightly

  # 500 random graphs (59 seconds on 8 cores, per docs/testing.md).
  fuzz:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['fuzz']
    name: fuzz (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.fuzz
      - name: Upload the shrunk cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-shrunk-${{ matrix.os }}
          path: test/out/fuzz/shrunk/
          if-no-files-found: ignore

  # Every ordered triple of edit kinds (80 seconds on 8 cores).
  props:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['props']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.props

  # sandbox-exec and DYLD_INSERT_LIBRARIES are macOS only. Whether the
  # hosted runner allows sandbox-exec profiles, and keeps DYLD_* for the Nix
  # store's programs, is unverified until the first run.
  conf-sandbox:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['conf-sandbox']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.conf-sandbox

  conf-depfiles:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['conf-depfiles']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.conf-depfiles

  conf-determinism:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['conf-determinism']
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.conf-determinism

  # 2,500 documents of each kind (16 seconds on 8 cores).
  toml-diff:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['toml-diff']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.toml-diff

  # The parser fuzzer, five minutes in each mode, with AddressSanitizer
  # (on by default off macOS). It has run only on macOS so far, so whether
  # the fuzz shell's clang links Lean's runtime on Linux is unverified until
  # the first run.
  parser-fuzz:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['parser-fuzz']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop .#fuzz -c test/run nightly.parser-fuzz
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fuzz-crash
          path: |
            test/out/fuzz-parser-text/crash/
            test/out/fuzz-parser-gen/crash/
          if-no-files-found: ignore

  # About 15 minutes locally on 2 workers; the runner has 3.
  mutants:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['mutants']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.mutants
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants
          path: test/out/mutants/results.md
          if-no-files-found: ignore

  # The full matrix, 500 random-graph cases per supported release.
  ninja:
    name: ninja ${{ matrix.release }} (${{ matrix.os }})
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['ninja']
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, release: "1.12.1" }
          - { os: ubuntu-latest, release: "1.13.2" }
          - { os: macos-latest, release: "1.13.2" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          RELEASE: ${{ matrix.release }}
        run: nix develop -c test/run nightly.ninja -- "$RELEASE"
      - name: Upload the harness logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ninja-${{ matrix.release }}-${{ matrix.os }}
          path: |
            test/out/matrix/
            test/out/fuzz/shrunk/
          if-no-files-found: ignore

  # Not pass/fail: it records what Ninja does under each mtime fault. The
  # HFS+ faults need hdiutil, and whether the runner lets it attach a disk
  # image is unverified. libfaketime adds the clock-skew fault.
  mtime-faults:
    needs: changed
    if: fromJSON(needs.changed.outputs.run)['mtime-faults']
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: nix develop -c test/run nightly.mtime-faults
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mtime-faults-report
          path: test/out/mtime-faults/report.txt
          if-no-files-found: warn
