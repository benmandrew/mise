# Checks for every pull request and every push to main. The heavy harnesses
# run in nightly.yml. Each job runs its commands in the flake's dev shell
# (`nix develop -c ...`), as docs/testing.md says to run them locally.
#
# OS: Linux is the main platform, so every job runs on ubuntu-latest
# (x86_64-linux). macOS (macos-latest, arm64) also runs the priority job,
# Ninja conformance on the latest release. The first GitHub run (11e7a90)
# passed proofs and the 1.13.2 harnesses on both.
#
# Local times are for one run of each job's commands inside `nix develop` on
# an 8-core M1 shared with other jobs (load average 4 to 17), with a warm
# Nix store; `proofs` ran first, from an empty .lake. The macos-latest runner
# has 3 cores, and each job also spends time installing Nix and restoring
# the caches, which has not been measured.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Build, no sorry/admit, axioms of the headline theorems, docs/trusted.md
  # up to date. The proofs do not depend on the Ninja release, so they run
  # once. This is the only job that saves the Lake cache, since it builds
  # every target. Local time: 7 to 13 s, from an empty .lake.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-lake: "true"
      - name: scripts/check.sh
        run: nix develop -c scripts/check.sh

  # The four shell harnesses (stage3-diff, stage4-hello, stage6-props
  # --order 2, fuzz) against each supported Ninja release, 1.12.1 (the
  # minimum) and 1.13.2, with 150 random-graph cases in place of 500. Local
  # times: 48 s on 1.12.1 and 52 s on 1.13.2.
  ninja:
    name: ninja ${{ matrix.release }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release: "1.12.1"
          - os: ubuntu-latest
            release: "1.13.2"
          # macOS runs the priority job only: Ninja conformance on the
          # latest release.
          - os: macos-latest
            release: "1.13.2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: test/ninja-matrix.sh --fuzz 150
        env:
          RELEASE: ${{ matrix.release }}
        run: nix develop -c test/ninja-matrix.sh --fuzz 150 "$RELEASE"
      - name: Upload the harness logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ninja-${{ matrix.release }}-${{ matrix.os }}
          path: |
            test/out/matrix/
            test/out/fuzz/shrunk/
          if-no-files-found: ignore

  # Cheap harnesses that ninja-matrix.sh does not run: the restat cmp
  # wrapper, the output wrapper on rules without restat, the hello-c
  # example, and the TOML parser against tomllib on 250 documents of each
  # kind in place of 2,500. Local times: 2 s, 2 s, 1 s and 5 s.
  extras:
    name: restat-cmp, wrap-outputs, stage4-hello, sugar, toml-diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: test/restat-cmp.sh
        run: nix develop -c test/restat-cmp.sh
      - name: test/wrap-outputs.sh
        run: nix develop -c test/wrap-outputs.sh
      - name: test/stage4-hello.sh
        run: nix develop -c test/stage4-hello.sh
      - name: test/sugar.sh
        run: nix develop -c test/sugar.sh
      - name: test/toml-diff.sh 250
        run: nix develop -c test/toml-diff.sh 250
